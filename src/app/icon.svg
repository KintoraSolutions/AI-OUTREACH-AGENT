<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 36 36" fill="none" role="img" aria-label="Katalyst">
  <!--
    Favicon. A flat, single-colour reduction of <KatalystMark>: the same angular
    "K" whose upper arm becomes an up-right arrow, with the metallic gradient
    collapsed to one solid white stroke on the app's dark canvas. At 16px a
    gradient reads as mud, and CSS custom properties do not resolve in a
    favicon, so the colours are literal here.
  -->
  <rect width="36" height="36" rx="8" fill="#101113" />
  <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 8.5V27.5" />
    <path d="M12.5 18.5 L24 27.5" />
    <path d="M12.5 17.5 L26 9" />
    <path d="M20.5 9 L26 9 L26 14.5" />
  </g>
</svg>
